<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your plan · C-MORE</title>
<meta name="robots" content="noindex">
<style>
/* Figtree, the brand face — same self-hosted files as the landing. */
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 300; font-display: swap; src: url("fonts/figtree-300.woff2") format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/figtree-400.woff2") format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/figtree-500.woff2") format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/figtree-600.woff2") format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/figtree-700.woff2") format('woff2'); }

/* The design system's tokens, the subset this page uses. */
:root {
  --color-graphite: #343434;
  --color-coral: #f46d4f;
  --color-coral-deep: #f44e29;
  --color-coral-tint: #f9e7e3;
  --color-blue: #4e638b;
  --color-mid-blue: #909db6;
  --color-off-white: #fafafa;
  --color-light-beige: #f2f1ed;
  --color-mid-beige: #e9e7e2;
  --color-dark-beige: #e0ded7;
  --color-sand-400: #c3c0b8;
  --color-sand-500: #96958e;
  --color-sand-600: #6e6e6a;
  --color-positive: #3f7d2e;
  --color-critical: #b3261e;

  --color-ground: var(--color-light-beige);
  --color-surface: #ffffff;
  --color-surface-sunken: var(--color-mid-beige);
  --color-ink: var(--color-graphite);
  --color-ink-muted: var(--color-blue);
  --color-ink-subtle: var(--color-sand-600);
  --color-line: var(--color-dark-beige);
  --color-activation: var(--color-coral);
  --color-activation-hover: var(--color-coral-deep);
  --color-activation-foreground: var(--color-graphite);

  --font-sans: 'Figtree', Arial, ui-sans-serif, system-ui, sans-serif;
  --ease-brand: cubic-bezier(0.22, 1, 0.36, 1);
  --radius-md: 0.75rem;
  --radius-pill: 9999px;
  --shadow-activate: 0 8px 28px -10px rgba(244, 109, 79, 0.55);
  --shadow-raised: 0 1px 2px rgba(52, 52, 52, 0.05), 0 4px 12px -6px rgba(52, 52, 52, 0.12);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--color-ground); color: var(--color-ink);
  font-family: var(--font-sans); font-size: 1rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased; font-synthesis-weight: none;
}
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }
a { color: var(--color-ink); text-decoration-color: var(--color-activation); text-underline-offset: 0.18em; }
:focus-visible { outline: 2px solid var(--color-graphite); outline-offset: 2px; border-radius: 0.5rem; }
::selection { background: var(--color-coral); color: var(--color-graphite); }

/* ---- Page frame --------------------------------------------------------- */
.reg { min-height: 100vh; display: flex; flex-direction: column; }
.reg-top { height: 4.5rem; border-bottom: 1px solid var(--color-line); }
/* the landing header's column: the site's 78rem measure, 2rem in on phones, 2.5rem from 64rem */
.hdr-in { width: 100%; max-width: 78rem; margin-inline: auto; padding-inline: 2rem; height: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
@media (min-width: 64rem) { .hdr-in { padding-inline: 2.5rem; } }

/* the logo file, at the landing header's size; the link carries the accessible name */
.brand { display: block; flex: none; line-height: 0; text-decoration: none; }
.brand img { display: block; width: 6.8rem; height: 1.25rem; }
.top-link { font-size: 0.875rem; color: var(--color-ink-subtle); text-decoration: none; }
.top-link:hover { color: var(--color-ink); }
.top-link b { font-weight: 500; color: var(--color-ink); }

.reg-main { flex: 1; display: grid; place-items: center; padding: 3rem 1.25rem 4rem; }
/* the landing's "Know more" cue, turned round: same eyebrow, same coral rule, pointing home */
.home-cue { display: flex; justify-content: center; padding-top: 1.75rem; }
.home-cue a { position: relative; display: inline-block; padding-bottom: 0.5rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; text-decoration: none; color: var(--color-ink-subtle); transition: color .14s var(--ease-brand); }
.home-cue a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--color-coral);
  transform: scaleX(.55); transition: transform .3s var(--ease-brand); }
.home-cue a:hover { color: var(--color-ink); }
.home-cue a:hover::after { transform: scaleX(1); }
.back-row { display: flex; justify-content: center; }
.stage { width: 100%; max-width: 30rem; }

/* one step visible at a time; the next rises in the way the page itself arrived */
.step { display: none; }
.step.is-on { display: block; animation: step-in .55s var(--ease-brand) both; }
@keyframes step-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-ink-muted); }
.eyebrow::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 1px; background: var(--color-coral); }
.title { margin-top: 1rem; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.02; letter-spacing: -0.028em; font-weight: 600; }
.title .soft { font-weight: 300; }
.title .one-line { display: block; white-space: nowrap; font-size: 0.74em; margin-top: 0.12em; }
.lead { margin-top: 1rem; font-size: 1.125rem; line-height: 1.55; font-weight: 300; color: var(--color-ink-muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: 3rem; padding-inline: 1.5rem;
  border: 1px solid transparent; border-radius: var(--radius-pill); font: inherit; font-weight: 500; font-size: 1rem;
  letter-spacing: -0.006em; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: transform .14s var(--ease-brand), box-shadow .22s var(--ease-brand), background-color .14s var(--ease-brand); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--color-activation); color: var(--color-activation-foreground); }
.btn-primary:hover:not(:disabled) { background: var(--color-activation-hover); box-shadow: var(--shadow-activate); color: var(--color-activation-foreground); }
.btn-block { width: 100%; }
.link-btn { border: 0; background: none; padding: 0; font: inherit; font-size: 0.875rem; color: var(--color-ink-subtle); cursor: pointer; text-decoration: underline; text-decoration-color: var(--color-line); text-underline-offset: 0.2em; }
.link-btn:hover { color: var(--color-ink); text-decoration-color: var(--color-activation); }


/* ---- Plan picker: the payment export, on the site's own tokens ---------- */
/* currency: one switch, shared by the plan picker and checkout */
.cur { display: inline-flex; padding: .1875rem; gap: .1875rem; background: var(--color-surface-sunken); border-radius: var(--radius-pill); }
.cur button { border: 0; background: transparent; cursor: pointer; font: inherit; font-size: .8125rem; font-weight: 600; letter-spacing: .02em; color: var(--color-ink-muted);
  padding: .375rem .875rem; border-radius: var(--radius-pill); transition: background-color .14s var(--ease-brand), color .14s var(--ease-brand), box-shadow .14s; }
.cur button:hover { color: var(--color-ink); }
.cur button[aria-checked="true"] { background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-raised); }
.cur button:focus-visible { outline: 2px solid var(--color-graphite); outline-offset: 2px; }
/* anchored from the top, same as checkout, so the headline stays put between the two steps */
.pay-page .reg-main { place-items: start center; padding-top: clamp(2rem, 10vh, 5.5rem); }
.stage { max-width: 57.5rem; display: flex; flex-direction: column; gap: 2.25rem; }
.intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
.intro .title { margin-top: 0; }
.w-mark { white-space: nowrap; background-image: linear-gradient(var(--color-coral), var(--color-coral)); background-repeat: no-repeat;
  background-position: 0 88%; background-size: 0% 0.28em; padding-inline: 0.06em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; animation: mark-in 1s var(--ease-brand) .5s forwards; }
@keyframes mark-in { to { background-size: 100% 0.28em; } }
.lede { max-width: 35rem; font-size: 1.0625rem; color: var(--color-ink-muted); }

.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
.plan { position: relative; min-height: 316px; padding: 1.75rem 1.875rem; border-radius: 18px; border: 1px solid var(--color-line); background: var(--color-surface); color: var(--color-ink);
  box-shadow: 0 1px 2px rgba(52,52,52,.04); text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 1rem;
  transition: background-color .35s var(--ease-brand), border-color .35s, box-shadow .35s, transform .14s var(--ease-brand); }
.plan:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(52,52,52,.05), 0 12px 28px -12px rgba(52,52,52,.22); }
.plan:focus-visible { outline: 3px solid var(--color-coral); outline-offset: 3px; }
.plan[aria-checked="true"] { background: var(--color-graphite); border-color: var(--color-graphite); color: var(--color-off-white); box-shadow: 0 30px 60px -28px rgba(52,52,52,.55); transform: none; }
.plan .muted { color: var(--color-ink-subtle); }
.plan[aria-checked="true"] .muted { color: var(--color-sand-400); }
.plan .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.plan .kind { display: flex; flex-direction: column; gap: .375rem; }
.plan .kind small { font-size: .8125rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.plan .kind span { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
.radio { width: 26px; height: 26px; border-radius: 999px; border: 2px solid var(--color-sand-400); flex: none; display: flex; align-items: center; justify-content: center; transition: background-color .25s, border-color .25s; }
.radio svg { opacity: 0; transition: opacity .2s; }
.plan[aria-checked="true"] .radio { border-color: var(--color-coral); background: var(--color-coral); }
.plan[aria-checked="true"] .radio svg { opacity: 1; }
.price { display: flex; flex-direction: column; gap: .375rem; }
.price .amt { display: flex; align-items: baseline; gap: .5rem; }
.price strong { font-size: 3.5rem; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
.price .per { font-size: 1.0625rem; }
.price .note { font-size: .9375rem; }
.feats { display: flex; flex-direction: column; gap: .625rem; padding-top: 1.125rem; border-top: 1px solid var(--color-mid-beige); font-size: .9375rem; line-height: 1.5; }
.plan[aria-checked="true"] .feats { border-top-color: rgba(250,250,250,.16); }
.feats span { display: flex; align-items: center; gap: .625rem; }
.feats svg { flex: none; }
.tag { position: absolute; top: -13px; left: 1.875rem; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--color-coral); color: var(--color-graphite); font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.actions { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding-top: .25rem; margin-top: 2.25rem; }
.actions .btn { padding-inline: 1.75rem; }

/* the landing's sphere, turning slowly behind the page */
.bg-sphere { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.reg { position: relative; z-index: 1; }
/* on to ALMA: the same off-white dissolve the sign-up used, so the company page arrives on one colour */
.to-company { position: fixed; inset: 0; z-index: 999; pointer-events: none; background: var(--color-off-white); opacity: 0; transition: opacity .9s ease; }
.to-company.on { opacity: 1; }

@media (max-width: 760px) {
  .pay-page .reg-main { padding-top: 1.75rem; }
  .intro { align-items: flex-start; text-align: left; gap: .75rem; }
  .lede { font-size: .9375rem; }
  .plans { grid-template-columns: 1fr; gap: .875rem; }
  .plan { min-height: 0; padding: 1.5rem 1.375rem 1.375rem; border-radius: 16px; }
  .plan:hover { transform: none; }
  .plan .kind span { font-size: 1.125rem; }
  .price strong { font-size: 2.75rem; }
  .price .per { font-size: .9375rem; } .price .note { font-size: .875rem; }
  .feats { font-size: .875rem; gap: .5rem; padding-top: .875rem; }
  .tag { left: 1.375rem; top: -12px; font-size: .6875rem; padding: 4px 10px; }
  .actions { gap: .875rem; }
  .actions .btn { width: 100%; height: 3.25rem; }
  /* annual first on a phone */
  .plan[data-plan="annual"] { order: -1; }
}
@media (prefers-reduced-motion: reduce) { .w-mark { animation: none; background-size: 100% 0.28em; } .to-company { transition: none; } }

/* ---- Arriving and leaving --------------------------------------------- */
/* Direct visits settle in; arrivals from the landing do not, because the landing
   already slid this exact frame up into place. */
.reg-main { animation: arrive .6s var(--ease-brand) both; }
.from-landing .reg-main, .embedded .reg-main { animation: none; }
@keyframes arrive { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
/* going back runs the landing's move in reverse: this page drops away downwards */
.leaving .reg { transform: translateY(100vh); transition: transform .7s cubic-bezier(0.7, 0, 0.2, 1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body class="pay-page">
<canvas class="bg-sphere" id="bg-sphere" aria-hidden="true"></canvas>
<div class="reg">
  <header class="reg-top"><div class="hdr-in">
    <a class="brand" href="index.html" data-back aria-label="C-MORE, back to the landing"><img src="images/cmore-logo.svg" alt="" width="109" height="20"></a>
    <span data-lang-switch></span>
  </div></header>

  <main class="reg-main">
    <div class="stage">
      <div class="intro">
        <span class="eyebrow">Founding member · Step 2 of 3</span>
        <h1 class="title">Choose how you want <span class="w-mark">to pay</span>.</h1>
        <p class="lede">Same founding-member access either way. Pick the billing that suits your company and continue to checkout.</p>
        <div class="cur" role="radiogroup" aria-label="Currency" id="cur">
          <button type="button" role="radio" aria-checked="true" data-cur="usd">USD $</button>
          <button type="button" role="radio" aria-checked="false" data-cur="eur">EUR €</button>
          <button type="button" role="radio" aria-checked="false" data-cur="cny">CNY ¥</button>
        </div>
      </div>

      <form id="plan-form" action="checkout.html" method="get" novalidate>
        <div class="plans" role="radiogroup" aria-label="Billing plan" id="plans">

          <button type="button" class="plan" role="radio" aria-checked="false" data-plan="monthly" tabindex="-1">
            <span class="head">
              <span class="kind"><small class="muted">Monthly</small><span>Pay as you go</span></span>
              <span class="radio" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#343434" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            </span>
            <span class="price">
              <span class="amt"><strong id="m-amt">$50</strong><span class="per muted">/ month</span></span>
              <span class="note muted" id="m-note">$600 over a year</span>
            </span>
            <span class="feats">
              <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f46d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Billed monthly</span>
            </span>
          </button>

          <button type="button" class="plan" role="radio" aria-checked="true" data-plan="annual" tabindex="0">
            <span class="tag">Founders’ early access</span>
            <span class="head">
              <span class="kind"><small class="muted">Annual</small><span>Commit for the year</span></span>
              <span class="radio" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#343434" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            </span>
            <span class="price">
              <span class="amt"><strong id="y-amt">$400</strong><span class="per muted">/ year</span></span>
              <span class="note muted" id="y-note">Works out at $33.33 / month · save $200</span>
            </span>
            <span class="feats">
              <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f46d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Billed once a year</span>
              <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f46d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Full founding-member perks</span>
            </span>
          </button>

        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Continue to checkout</button>
          <a class="link-btn" href="register.html#password" id="pay-back">Back</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/app-3.js"></script>
<script>
(() => {
  try {
    if (window.__sphere) window.__sphere.mountSphere(document.getElementById('bg-sphere'), {
      n: 460, ink: '52,52,52', lineAlpha: 0.06, lineBase: 0.015, dotAlpha: 0.18, radius: 0.46,
      inkOpacityMobile: 0.7, radiusMobile: 0.62, scrollRot: 0.0012, pointer: 0.5, coralPoint: true });
  } catch (e) { console.error(e); }
  const qs = new URLSearchParams(location.search);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- the plans: a radio group, annual preselected ---------------------------
  const plans = [...document.querySelectorAll('.plan')];
  // ---- currency: USD, EUR or CNY, carried between the plan picker and checkout ----
  // Prices per currency. EUR and CNY are placeholders until the real ones are set.
  const CUR = { usd: { sym: '$', m: 50, y: 400 }, eur: { sym: '€', m: 50, y: 400 }, cny: { sym: '¥', m: 360, y: 2880 } };
  const money = (c, n) => CUR[c].sym + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  let cur = (() => { const v = qs.get('cur'); if (CUR[v]) return v; try { const s = sessionStorage.getItem('cm-cur'); if (CUR[s]) return s; } catch (e) {} return 'usd'; })();
  const curBtns = [...document.querySelectorAll('#cur [role="radio"]')];
  const onCur = [];
  const setCur = (c) => {
    cur = c;
    try { sessionStorage.setItem('cm-cur', c); } catch (e) {}
    curBtns.forEach((b) => { const on = b.dataset.cur === c; b.setAttribute('aria-checked', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    onCur.forEach((f) => f());
  };
  curBtns.forEach((b) => {
    b.addEventListener('click', () => setCur(b.dataset.cur));
    b.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) return;
      e.preventDefault();
      const i = curBtns.indexOf(b), n = curBtns[(i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + curBtns.length) % curBtns.length];
      setCur(n.dataset.cur); n.focus();
    });
  });
  onCur.push(() => {
    const c = CUR[cur];
    document.getElementById('m-amt').textContent = money(cur, c.m);
    document.getElementById('m-note').textContent = money(cur, c.m * 12) + ' over a year';
    document.getElementById('y-amt').textContent = money(cur, c.y);
    document.getElementById('y-note').textContent = 'Works out at ' + money(cur, Math.round(c.y / 12 * 100) / 100) + ' / month · save ' + money(cur, c.m * 12 - c.y);
  });
  setCur(cur);

  let chosen = 'annual';
  const select = (plan) => {
    chosen = plan;
    plans.forEach((p) => { const on = p.dataset.plan === plan; p.setAttribute('aria-checked', on ? 'true' : 'false'); p.tabIndex = on ? 0 : -1; });
  };
  plans.forEach((p) => {
    p.addEventListener('click', () => select(p.dataset.plan));
    p.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) return;
      e.preventDefault();
      const i = plans.indexOf(p), n = (i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + plans.length) % plans.length;
      select(plans[n].dataset.plan); plans[n].focus();
    });
  });
  const q = qs.get('plan');
  if (q === 'monthly' || q === 'annual') select(q);

  // ---- on to checkout, with the chosen plan -----------------------------------
  document.getElementById('plan-form').addEventListener('submit', (e) => {
    e.preventDefault();
    location.href = 'checkout.html?plan=' + chosen + '&cur=' + cur;
  });

  // Back goes to the sign-up's last step (register.html#password), which that page remembers for this tab.
  document.querySelectorAll('[data-back]').forEach((a) => a.addEventListener('click', (e) => {
    if (reduced || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    document.documentElement.classList.add('leaving');
    setTimeout(() => { location.href = a.getAttribute('href'); }, 620);
  }));
  addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    document.documentElement.classList.remove('leaving');
    document.querySelectorAll('.to-company').forEach((v) => v.remove());
  });
})();
</script>
<script src="js/lang.js"></script>
</body>
</html>
