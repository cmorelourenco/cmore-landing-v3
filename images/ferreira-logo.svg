<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ferreira Construction">
  <!-- Ferreira Construction LLC: a made-up company for the prototype. A steel-blue tile, an
       ochre roof beam over an F built from three girders. -->
  <rect width="96" height="96" rx="20" fill="#1f3a5f"/>
  <!-- roof beam -->
  <path d="M18 40 48 18l30 22" fill="none" stroke="#f2b544" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the F, as girders -->
  <rect x="31" y="42" width="8" height="36" rx="1.5" fill="#f4f1ea"/>
  <rect x="31" y="42" width="34" height="8" rx="1.5" fill="#f4f1ea"/>
  <rect x="31" y="57" width="24" height="7" rx="1.5" fill="#f4f1ea"/>
  <!-- rivets on the top girder -->
  <circle cx="47" cy="46" r="1.6" fill="#1f3a5f"/>
  <circle cx="57" cy="46" r="1.6" fill="#1f3a5f"/>
</svg>
